<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>半马训练打卡</title>
<meta name="description" content="5 个月 / 20 周 / 63 次训练，按顺序打卡，忙了顺延，完成总量即达标。">
<meta name="theme-color" content="#cf5f2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="半马打卡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon-512.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <h1>半马训练打卡</h1>
  <div class="sub">5 个月 · 20 周 · 63 次训练　|　按顺序完成，忙了顺延，做完总量就达标</div>
  <div class="bar"><i id="barFill" style="width:0%"></i></div>
  <div class="bar-label"><span>已完成 <b id="barDone">0 / 63 次</b></span><span><b id="barPct">0%</b></span></div>
</header>

<div class="nudge" id="backupNudge" hidden>
  <span id="backupNudgeText"></span>
  <button class="nudge-btn" id="backupNudgeBtn">立即备份</button>
</div>

<section class="card" id="nextCard"></section>

<section class="card timer" id="timerCard" hidden></section>

<section class="stats" id="stats"></section>

<section class="card" id="recentCard" hidden></section>

<details class="plan">
  <summary>全部计划（20 周）</summary>
  <div class="weeks" id="weeks"></div>
</details>

<details class="tools" id="toolsBox">
  <summary>⚙ 备份 / 恢复 / 清空</summary>
  <div class="tools-body">
    <p>打卡记录只存在这台手机里，iOS 偶尔会清掉。「保存备份」会打开分享面板，存进备忘录 / 文件，或发给自己。<b>要存文字，别只截图</b>——截图恢复不了。</p>
    <p id="backupStatus" class="muted"></p>
    <textarea id="backupBox" placeholder="恢复时把备份文本粘进这里，再点「导入备份」。"></textarea>
    <div class="mini-row">
      <button class="mini" id="saveBtn">保存备份</button>
      <button class="mini" id="importBtn">导入备份</button>
      <button class="mini danger" id="resetBtn">清空</button>
    </div>
  </div>
</details>

<div class="foot">数据全部保存在本机 · 无账号 · 无网络也能打卡</div>
<div class="foot ver" id="verFoot"></div>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
