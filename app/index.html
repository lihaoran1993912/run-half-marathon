<title>半马训练打卡</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#f4f6f8; --surface:#ffffff; --surface-2:#eceff3; --sunken:#e4e8ee;
    --ink:#1b2330; --ink-dim:#586173; --ink-faint:#8b94a2;
    --line:#dde2e9;
    --ember:#cf5f2b; --ember-soft:#f6e4d8;
    --pine:#2b756f; --pine-soft:#dbebe9;
    --clay:#b3423a; --clay-soft:#f3dbd9;
    --moss:#2f8f4e; --moss-soft:#d9eddf;
    --slate:#8a93a0;
    --shadow:0 1px 2px rgba(20,28,40,.05), 0 8px 22px rgba(20,28,40,.07);
    --focus:#2f6df0;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0f131a; --surface:#161d27; --surface-2:#1e2732; --sunken:#121924;
      --ink:#e9edf2; --ink-dim:#9aa4b2; --ink-faint:#6f7a89;
      --line:#2a3340;
      --ember:#ef8a52; --ember-soft:#37241a;
      --pine:#58b8b0; --pine-soft:#123230;
      --clay:#e2726a; --clay-soft:#3a201e;
      --moss:#54ba74; --moss-soft:#16311f;
      --slate:#77818f;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.4);
      --focus:#6ea0ff;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0f131a; --surface:#161d27; --surface-2:#1e2732; --sunken:#121924;
    --ink:#e9edf2; --ink-dim:#9aa4b2; --ink-faint:#6f7a89;
    --line:#2a3340;
    --ember:#ef8a52; --ember-soft:#37241a;
    --pine:#58b8b0; --pine-soft:#123230;
    --clay:#e2726a; --clay-soft:#3a201e;
    --moss:#54ba74; --moss-soft:#16311f;
    --slate:#77818f;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.4);
    --focus:#6ea0ff;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
    padding:0 0 calc(84px + env(safe-area-inset-bottom));
  }
  .num{font-family:"Barlow Semi Condensed","Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .wrap{max-width:460px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 15px 15px}

  /* ---------- header ---------- */
  .hdr{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:18px 18px 16px; box-shadow:var(--shadow); position:relative;
  }
  .hdr h1{
    margin:0; font-size:13px; font-weight:700; letter-spacing:.14em;
    color:var(--ink-faint); text-transform:uppercase;
    font-family:"Barlow Semi Condensed",sans-serif;
  }
  .gear{
    position:absolute; top:12px; right:10px; width:34px; height:34px;
    border:none; background:transparent; color:var(--ink-faint);
    font-size:19px; cursor:pointer; border-radius:9px; line-height:1;
  }
  .gear:hover{background:var(--surface-2);color:var(--ink-dim)}
  .count{display:flex; align-items:baseline; gap:8px; margin-top:6px}
  .count b{font-size:46px; font-weight:700; color:var(--ember); letter-spacing:-.01em}
  .count .unit{font-size:15px; font-weight:600; color:var(--ink)}
  .count .to{font-size:12.5px; color:var(--ink-dim); margin-left:auto; text-align:right; max-width:42%}
  .bar{margin-top:12px; height:9px; border-radius:999px; background:var(--sunken); overflow:hidden}
  .bar>i{display:block; height:100%; background:var(--ember); border-radius:999px; transition:width .4s ease}
  .sub{
    display:flex; justify-content:space-between; gap:10px; margin-top:9px;
    font-size:12.5px; color:var(--ink-dim);
  }
  .sub .done-n{color:var(--ink); font-weight:600}
  .legend{display:flex; gap:14px; margin-top:13px; padding-top:12px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-dim)}
  .legend span{display:inline-flex; align-items:center; gap:5px}
  .dot{width:9px; height:9px; border-radius:3px; flex:none}
  .dot.easy{background:var(--pine)} .dot.quality{background:var(--clay)} .dot.long{background:var(--ember)}

  /* ---------- week list ---------- */
  .weeks{display:flex; flex-direction:column; gap:9px; margin-top:16px}
  .wk{background:var(--surface); border:1px solid var(--line); border-radius:13px; overflow:hidden}
  .wk.cur{border-color:var(--ember); box-shadow:inset 4px 0 0 var(--ember)}
  .wk.past{background:var(--surface)}
  .wk-head{
    all:unset; box-sizing:border-box; display:flex; align-items:center; gap:10px;
    width:100%; padding:13px 15px; cursor:pointer;
  }
  .wk-head:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
  .wk-n{font-size:15px; font-weight:700; color:var(--ink); flex:none; min-width:64px}
  .wk.past .wk-n{color:var(--ink-dim)}
  .wk-focus{font-size:12.5px; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
  .wk-tag{
    font-family:"Barlow Semi Condensed",sans-serif; font-size:12px; font-weight:600;
    flex:none; padding:2px 9px; border-radius:999px; letter-spacing:.02em;
  }
  .wk-tag.full{background:var(--moss-soft); color:var(--moss)}
  .wk-tag.part{background:var(--ember-soft); color:var(--ember)}
  .wk-tag.none{background:var(--surface-2); color:var(--ink-faint)}
  .wk-body{padding:2px 15px 14px}
  .wk-note{
    font-size:12px; color:var(--ink-dim); background:var(--surface-2);
    border-radius:9px; padding:8px 10px; margin:6px 0 4px;
  }

  .sess{border-top:1px solid var(--line); padding:13px 0 4px}
  .sess:first-of-type{border-top:none}
  .sess-top{display:flex; align-items:baseline; gap:8px}
  .sess-tag{
    font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; flex:none;
    font-family:"Barlow Semi Condensed","Noto Sans SC",sans-serif;
  }
  .sess-tag.easy{background:var(--pine-soft); color:var(--pine)}
  .sess-tag.quality{background:var(--clay-soft); color:var(--clay)}
  .sess-tag.long{background:var(--ember-soft); color:var(--ember)}
  .sess-tag.race{background:var(--ember); color:#fff}
  .sess-title{font-size:14.5px; font-weight:500; color:var(--ink); flex:1}
  .sess.race .sess-title{font-weight:700; color:var(--ember)}
  .sess-why{font-size:12px; color:var(--ink-dim); margin:4px 0 0}
  .sess-btn{
    margin-top:10px; width:100%; padding:10px; border-radius:10px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink-dim);
    font-family:inherit; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .sess-btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  .sess-btn.done{background:var(--moss); border-color:var(--moss); color:#fff}
  @media (prefers-reduced-motion:no-preference){
    .sess-btn,.bar>i{transition:background .15s ease, width .4s ease}
    .jump{transition:opacity .2s ease, transform .2s ease}
  }

  /* ---------- jump-to-current ---------- */
  .jump{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));
    padding:11px 20px; border-radius:999px; border:none;
    background:var(--ink); color:var(--paper); font-family:inherit;
    font-weight:600; font-size:13px; cursor:pointer; box-shadow:var(--shadow);
  }
  .jump[hidden]{opacity:0; pointer-events:none}

  /* ---------- settings sheet ---------- */
  .sheet{position:fixed; inset:0; background:rgba(10,14,20,.45); display:flex; align-items:flex-end; z-index:20}
  .sheet-card{
    background:var(--surface); width:100%; max-width:460px; margin:0 auto;
    border-radius:18px 18px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:86vh; overflow-y:auto; box-shadow:var(--shadow);
  }
  .sheet-card h2{margin:0 0 4px; font-size:16px}
  .sheet-card .close{float:right; border:none; background:transparent; font-size:20px; color:var(--ink-faint); cursor:pointer; line-height:1}
  .field{margin-top:15px}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-dim); margin-bottom:5px}
  .field input[type=date], .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:9px;
    background:var(--sunken); color:var(--ink); font-family:inherit; font-size:14px;
  }
  .field textarea{min-height:78px; resize:vertical; font-size:12px; line-height:1.45}
  .paces{font-size:12.5px; color:var(--ink-dim); margin:0; padding-left:18px}
  .paces li{margin:3px 0}
  .btn-row{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
  .mini{
    padding:8px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-family:inherit;
    font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .mini.danger{color:var(--clay); border-color:var(--clay-soft)}
  .hint{font-size:11.5px; color:var(--ink-faint); margin:6px 0 0}
</style>

<div class="wrap">
  <header class="hdr">
    <button class="gear" id="gear" aria-label="设置">⚙</button>
    <h1>零基础 · 半程马拉松</h1>
    <div class="count">
      <b class="num" id="cd-days">—</b><span class="unit">天</span>
      <span class="to" id="cd-to">距比赛日</span>
    </div>
    <div class="bar"><i id="bar-fill" style="width:0%"></i></div>
    <div class="sub">
      <span id="wk-label">—</span>
      <span><span class="done-n num" id="done-n">0</span> / <span class="num" id="total-n">0</span> 次完成</span>
    </div>
    <div class="legend">
      <span><i class="dot easy"></i>轻松跑</span>
      <span><i class="dot quality"></i>节奏 / 稳定跑</span>
      <span><i class="dot long"></i>长距离跑</span>
    </div>
  </header>

  <div class="weeks" id="weeks"></div>
</div>

<button class="jump" id="jump" hidden>↑ 回到本周</button>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <button class="close" id="sheet-close" aria-label="关闭">✕</button>
    <h2>设置</h2>
    <div class="field">
      <label for="in-start">训练开始日期（每周从这天算）</label>
      <input type="date" id="in-start">
    </div>
    <div class="field">
      <label for="in-race">比赛日期</label>
      <input type="date" id="in-race">
    </div>
    <div class="field">
      <label>配速参考（按感觉为主，数字只是参照）</label>
      <ul class="paces">
        <li>轻松跑：约 10:00 / 公里 — 能完整说话、不喘</li>
        <li>稳定跑：约 9:00 / 公里 — 只能说短句</li>
        <li>节奏跑：约 8:30 / 公里 — 只能蹦单词</li>
        <li>半马目标配速：约 9:15 / 公里（约 3:15 完赛）</li>
        <li>长距离：轻松配速，或再慢 15–30 秒</li>
      </ul>
      <p class="hint">第 16 周做一次 2–3 公里计时，用结果校准以上配速。</p>
    </div>
    <div class="field">
      <label for="out-backup">导出备份（复制存到备忘录，防手机清数据）</label>
      <textarea id="out-backup" readonly></textarea>
      <div class="btn-row"><button class="mini" id="copy-backup">复制</button></div>
    </div>
    <div class="field">
      <label for="in-backup">导入备份（粘贴之前导出的内容，覆盖当前进度）</label>
      <textarea id="in-backup" placeholder='{"start":"…","done":{…}}'></textarea>
      <div class="btn-row">
        <button class="mini" id="do-import">导入</button>
        <button class="mini danger" id="do-reset">清空所有打卡</button>
      </div>
    </div>
    <p class="hint" id="sync-note">进度保存中…</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var DAY = 86400000;

  // ---------- 训练计划（40 周 / 每周 3 次）----------
  function wk(n, ph, f, nt, s){ return {n:n, ph:ph, f:f, nt:nt, s:s}; }
  function E(t,w){ return {k:"easy", tag:"轻松", t:t, w:w||""}; }
  function Q(t,w){ return {k:"quality", tag:"节奏", t:t, w:w||""}; }
  function L(t,w){ return {k:"long", tag:"长距离", t:t, w:w||""}; }
  function R(t,w){ return {k:"race", tag:"比赛", t:t, w:w||""}; }

  var PLAN = [
    wk(1,"适应期","先让身体习惯每周跑三次","累了可以走一走，本阶段不追速度。可另加 1 次 20 分钟力量。",[
      E("轻松跑 12 分钟","起步别急，慢到能哼歌"),
      E("轻松跑 15 分钟","同样强度，多跑一点点"),
      L("长距离 18 分钟（累了可走 1–2 次）","这周最长的一次，完成就好")]),
    wk(2,"适应期","把每次都跑完，尽量不走","",[
      E("轻松跑 15 分钟"),
      E("轻松跑 18 分钟"),
      L("长距离 22 分钟","争取全程不走")]),
    wk(3,"适应期","第一次加入快步跑","快步：轻快加速十几秒，不是冲刺，走回来恢复。",[
      E("轻松跑 18 分钟"),
      E("轻松跑 20 分钟 + 快步 4×15 秒"),
      L("长距离 26 分钟")]),
    wk(4,"适应期","减量周：跑少一点，让身体吸收","别嫌少，减量是训练的一部分。",[
      E("轻松跑 15 分钟"),
      E("轻松跑 18 分钟"),
      L("长距离 22 分钟")]),

    wk(5,"基础期","长跑第一次到 30 分钟","",[
      E("轻松跑 20 分钟"),
      E("轻松跑 22 分钟 + 快步 4×20 秒"),
      L("长距离 30 分钟","能连续跑 30 分钟是个里程碑")]),
    wk(6,"基础期","稳步加量","",[
      E("轻松跑 22 分钟"),
      E("轻松跑 25 分钟"),
      L("长距离 35 分钟（约 3.5 公里）")]),
    wk(7,"基础期","跑量再上一点","",[
      E("轻松跑 25 分钟"),
      E("轻松跑 25 分钟 + 快步 5×20 秒"),
      L("长距离 40 分钟（约 4 公里）")]),
    wk(8,"基础期","减量周","按计划减，别贪。",[
      E("轻松跑 20 分钟"),
      E("轻松跑 22 分钟"),
      L("长距离 30 分钟")]),
    wk(9,"基础期","长跑迈向 45 分钟","",[
      E("轻松跑 25 分钟"),
      E("轻松跑 28 分钟 + 快步 5×20 秒"),
      L("长距离 45 分钟（约 4.5 公里）")]),
    wk(10,"基础期","跑量稳定爬升","",[
      E("轻松跑 28 分钟"),
      E("轻松跑 30 分钟"),
      L("长距离 50 分钟（约 5 公里）")]),
    wk(11,"基础期","长跑改用距离计","",[
      E("轻松跑 30 分钟"),
      E("轻松跑 30 分钟 + 快步 6×20 秒"),
      L("长距离 5.5 公里","从这周起长跑按公里数算")]),
    wk(12,"基础期","减量周","",[
      E("轻松跑 22 分钟"),
      E("轻松跑 25 分钟"),
      L("长距离 40 分钟")]),
    wk(13,"基础期","重新加量","",[
      E("轻松跑 32 分钟"),
      E("轻松跑 32 分钟 + 快步 6×20 秒"),
      L("长距离 6.5 公里")]),
    wk(14,"基础期","稳住节奏","",[
      E("轻松跑 35 分钟"),
      E("轻松跑 35 分钟"),
      L("长距离 7.5 公里")]),
    wk(15,"基础期","长跑接近 9 公里","",[
      E("轻松跑 35 分钟"),
      E("轻松跑 38 分钟 + 快步 6×25 秒"),
      L("长距离 8.5 公里")]),
    wk(16,"基础期","减量周 + 做一次计时测试","找一段平路，2–3 公里尽力跑，记时间，用来校准配速。",[
      E("轻松跑 28 分钟"),
      E("轻松跑 30 分钟"),
      L("长距离 6 公里")]),

    wk(17,"进阶期","第一次“稳定跑”","稳定跑：比轻松快一点，只能说短句，不能聊天。",[
      E("轻松跑 40 分钟"),
      Q("轻松 40 分钟，中间 10 分钟稳定跑（约 9:00）"),
      L("长距离 9 公里")]),
    wk(18,"进阶期","稳定跑再延长一点","",[
      E("轻松跑 40 分钟"),
      Q("轻松 42 分钟，中间 12 分钟稳定跑"),
      L("长距离 10 公里")]),
    wk(19,"进阶期","把稳定跑拆成两段","",[
      E("轻松跑 42 分钟"),
      Q("轻松 44 分钟，中间 2×8 分钟稳定跑（间隔慢跑 2 分钟）"),
      L("长距离 11 公里")]),
    wk(20,"进阶期","减量周","",[
      E("轻松跑 30 分钟"),
      E("轻松跑 35 分钟"),
      L("长距离 8 公里")]),
    wk(21,"进阶期","减量后回到加量","",[
      E("轻松跑 45 分钟"),
      Q("轻松 45 分钟，中间 15 分钟稳定跑"),
      L("长距离 11 公里")]),
    wk(22,"进阶期","长跑末段试试比赛配速","",[
      E("轻松跑 45 分钟"),
      Q("轻松 45 分钟，中间 18 分钟稳定跑"),
      L("长距离 12 公里（最后 2 公里提到半马目标配速）")]),
    wk(23,"进阶期","第一次“节奏跑”","节奏跑：舒服的辛苦，只能蹦单词。",[
      E("轻松跑 45 分钟"),
      Q("轻松 48 分钟，中间 2×10 分钟节奏跑（约 8:30）"),
      L("长距离 13 公里")]),
    wk(24,"进阶期","减量周","",[
      E("轻松跑 35 分钟"),
      E("轻松跑 40 分钟"),
      L("长距离 9 公里")]),
    wk(25,"进阶期","长跑练补给","超过 75–90 分钟的跑步就该练边跑边补。",[
      E("轻松跑 48 分钟"),
      Q("轻松 48 分钟，中间 22 分钟节奏跑"),
      L("长距离 13 公里（每 30–40 分钟补一次水 / 能量胶）")]),
    wk(26,"进阶期","节奏跑拆成两段","",[
      E("轻松跑 50 分钟"),
      Q("轻松 50 分钟，中间 2×12 分钟节奏跑"),
      L("长距离 14 公里")]),
    wk(27,"进阶期","长跑末段跑比赛配速","",[
      E("轻松跑 50 分钟"),
      Q("轻松 50 分钟，中间 25 分钟节奏跑"),
      L("长距离 14 公里（最后 3 公里半马目标配速）")]),
    wk(28,"进阶期","减量周","",[
      E("轻松跑 35 分钟"),
      E("轻松跑 40 分钟"),
      L("长距离 10 公里")]),

    wk(29,"半马专项期","长跑里嵌入比赛配速","",[
      E("轻松跑 50 分钟"),
      Q("轻松 45 分钟，中间 20 分钟节奏跑"),
      L("长距离 15 公里（最后 3 公里半马目标配速）")]),
    wk(30,"半马专项期","第一次连续跑 5 公里比赛配速","",[
      E("轻松跑 50 分钟"),
      Q("配速跑：热身 10 分钟 + 5 公里半马目标配速 + 放松 10 分钟"),
      L("长距离 16 公里")]),
    wk(31,"半马专项期","全程演练补给补水","",[
      E("轻松跑 50 分钟"),
      Q("轻松 45 分钟，中间 25 分钟节奏跑"),
      L("长距离 17 公里（全程练补给和补水）")]),
    wk(32,"半马专项期","减量周","",[
      E("轻松跑 35 分钟"),
      E("轻松跑 40 分钟"),
      L("长距离 12 公里")]),
    wk(33,"半马专项期","长距离推到 18 公里","",[
      E("轻松跑 50 分钟"),
      Q("配速跑：热身 10 分钟 + 6 公里半马目标配速 + 放松 10 分钟"),
      L("长距离 18 公里")]),
    wk(34,"半马专项期","比赛配速段拉到 8 公里","",[
      E("轻松跑 45 分钟"),
      Q("配速跑：热身 10 分钟 + 8 公里半马目标配速 + 放松 10 分钟"),
      L("长距离 16 公里")]),
    wk(35,"半马专项期","比赛日彩排","用比赛日的起床时间、早餐、装备、配速走一遍。",[
      E("轻松跑 50 分钟"),
      Q("轻松 50 分钟，中间 25 分钟节奏跑"),
      L("长距离 19 公里","训练里最长的一次，跑到 19 公里就够，不用跑满 21")]),
    wk(36,"半马专项期","彩排之后回落一周","",[
      E("轻松跑 45 分钟"),
      Q("配速跑：热身 10 分钟 + 6 公里半马目标配速 + 放松 10 分钟"),
      L("长距离 15 公里")]),
    wk(37,"半马专项期","最后一个大周，下周开始减量","",[
      E("轻松跑 40 分钟"),
      Q("轻松 40 分钟，中间 20 分钟节奏跑"),
      L("长距离 13 公里")]),

    wk(38,"减量期","开始减量，腿发痒是正常的","跑量砍下来，别补练。",[
      E("轻松跑 35 分钟"),
      Q("轻松 35 分钟，中间 15 分钟半马目标配速"),
      L("长距离 10 公里")]),
    wk(39,"减量期","再减一档，攒精神","",[
      E("轻松跑 30 分钟"),
      Q("轻松 25 分钟，中间 10 分钟半马目标配速"),
      L("长距离 7 公里")]),

    wk(40,"比赛周","少跑、多睡、正常吃碳水","相信训练，别临时加练。",[
      E("赛前 4 天：轻松跑 25 分钟 + 快步 4×20 秒","活动开就好，别累着"),
      E("赛前 2 天：轻松跑 15 分钟，或完全休息","养精蓄锐"),
      R("比赛日：半程马拉松 21.0975 公里","前 5 公里一定压住配速；把 21 拆成 3 个 7")])
  ];

  var TOTAL = PLAN.reduce(function(a,w){return a + w.s.length;}, 0);
  function sid(n,i){ return "w"+n+"s"+(i+1); }

  // ---------- 状态 ----------
  var LS_KEY = "hm_tracker_v1";
  function todayISO(){ var d=new Date(); d.setHours(0,0,0,0);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parseISO(s){ var p=String(s||"").split("-"); var d=new Date(+p[0], (+p[1]||1)-1, +p[2]||1); d.setHours(0,0,0,0); return d; }
  function defaultState(){ return { start:"2026-09-14", race:"2027-06-24", done:{}, updated:0 }; }
  function normalize(o){
    o = o && typeof o==="object" ? o : {};
    return {
      start: /^\d{4}-\d{2}-\d{2}$/.test(o.start) ? o.start : "2026-09-14",
      race:  /^\d{4}-\d{2}-\d{2}$/.test(o.race)  ? o.race  : "2027-06-24",
      done:  (o.done && typeof o.done==="object") ? o.done : {},
      updated: +o.updated || 0
    };
  }
  function loadLS(){ try{ return normalize(JSON.parse(localStorage.getItem(LS_KEY))); }catch(e){ return null; } }
  function saveLS(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

  var state = loadLS() || defaultState();
  var docRef = null;
  var syncMode = "local";

  // ---------- 计算 ----------
  function currentWeek(){
    var diff = Math.floor((parseISO(todayISO()) - parseISO(state.start)) / (DAY*7)) + 1;
    return Math.max(1, Math.min(PLAN.length, diff));
  }
  function daysToRace(){
    return Math.round((parseISO(state.race) - parseISO(todayISO())) / DAY);
  }
  function doneCount(){
    var c=0; for(var k in state.done){ if(state.done[k]) c++; } return c;
  }
  function weekDone(w){
    var c=0; for(var i=0;i<w.s.length;i++){ if(state.done[sid(w.n,i)]) c++; } return c;
  }

  // ---------- 渲染 ----------
  var openWeeks = {};
  var els = {
    days: document.getElementById("cd-days"),
    to: document.getElementById("cd-to"),
    fill: document.getElementById("bar-fill"),
    wkLabel: document.getElementById("wk-label"),
    doneN: document.getElementById("done-n"),
    totalN: document.getElementById("total-n"),
    weeks: document.getElementById("weeks"),
    jump: document.getElementById("jump"),
    syncNote: document.getElementById("sync-note")
  };
  els.totalN.textContent = TOTAL;

  var curWkEl = null;

  function render(){
    var cur = currentWeek();
    var dtr = daysToRace();
    els.days.textContent = dtr >= 0 ? dtr : "0";
    var rd = parseISO(state.race);
    els.to.textContent = dtr < 0 ? "比赛日已过" : ("距 " + (rd.getMonth()+1) + " 月 " + rd.getDate() + " 日");
    var dc = doneCount();
    els.doneN.textContent = dc;
    els.fill.style.width = (TOTAL ? Math.round(dc/TOTAL*100) : 0) + "%";
    var curW = PLAN[cur-1];
    els.wkLabel.textContent = "第 " + cur + " 周 / 共 " + PLAN.length + " 周 · " + curW.ph;

    if(!openWeeks.__init){ openWeeks[cur] = true; openWeeks.__init = true; }

    els.weeks.innerHTML = "";
    curWkEl = null;
    PLAN.forEach(function(w){
      var done = weekDone(w);
      var isCur = w.n === cur;
      var isPast = w.n < cur;
      var open = !!openWeeks[w.n];

      var card = document.createElement("section");
      card.className = "wk" + (isCur ? " cur" : "") + (isPast ? " past" : "");

      var head = document.createElement("button");
      head.className = "wk-head";
      head.setAttribute("aria-expanded", open ? "true" : "false");
      var tagCls = done === w.s.length ? "full" : (done > 0 ? "part" : "none");
      var tagTxt = done === w.s.length ? "✓ 完成" : (done + " / " + w.s.length);
      var focusTxt = (w.f && w.f.trim()) ? w.f : w.ph;
      head.innerHTML =
        '<span class="wk-n num">第 ' + w.n + ' 周</span>' +
        '<span class="wk-focus">' + esc(isCur ? ("本周 · " + focusTxt) : focusTxt) + '</span>' +
        '<span class="wk-tag ' + tagCls + '">' + tagTxt + '</span>';
      head.addEventListener("click", function(){
        openWeeks[w.n] = !openWeeks[w.n];
        render();
      });
      card.appendChild(head);

      if(open){
        var body = document.createElement("div");
        body.className = "wk-body";
        if(w.nt && w.nt.trim()){
          var note = document.createElement("div");
          note.className = "wk-note";
          note.textContent = w.nt;
          body.appendChild(note);
        }
        w.s.forEach(function(s, i){
          var id = sid(w.n, i);
          var isDone = !!state.done[id];
          var row = document.createElement("div");
          row.className = "sess" + (s.k === "race" ? " race" : "");
          var why = s.w ? '<p class="sess-why">' + esc(s.w) + '</p>' : '';
          row.innerHTML =
            '<div class="sess-top">' +
              '<span class="sess-tag ' + s.k + '">' + esc(s.tag) + '</span>' +
              '<span class="sess-title">' + esc(s.t) + '</span>' +
            '</div>' + why;
          var btn = document.createElement("button");
          btn.className = "sess-btn" + (isDone ? " done" : "");
          btn.setAttribute("aria-pressed", isDone ? "true" : "false");
          btn.textContent = isDone ? ("已完成 · " + fmtShort(state.done[id])) : "完成";
          btn.addEventListener("click", function(){ toggle(id); });
          row.appendChild(btn);
          body.appendChild(row);
        });
        card.appendChild(body);
      }

      els.weeks.appendChild(card);
      if(isCur) curWkEl = card;
    });

    observeCurrent();
    refreshBackup();
  }

  function toggle(id){
    if(state.done[id]) delete state.done[id];
    else state.done[id] = todayISO();
    state.updated = Date.now();
    saveLS();
    pushRemote();
    render();
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fmtShort(iso){ var p=String(iso).split("-"); return p.length===3 ? (+p[1])+"/"+(+p[2]) : iso; }

  // ---------- 回到本周 ----------
  var io = null;
  function observeCurrent(){
    if(io){ io.disconnect(); io = null; }
    if(!curWkEl || !("IntersectionObserver" in window)){ els.jump.hidden = true; return; }
    io = new IntersectionObserver(function(entries){
      els.jump.hidden = entries[0].isIntersecting;
    }, {threshold:0.15});
    io.observe(curWkEl);
  }
  els.jump.addEventListener("click", function(){
    if(!openWeeks[currentWeek()]){ openWeeks[currentWeek()] = true; render(); }
    if(curWkEl) curWkEl.scrollIntoView({behavior:"smooth", block:"start"});
  });

  // ---------- 设置面板 ----------
  var sheet = document.getElementById("sheet");
  var inStart = document.getElementById("in-start");
  var inRace = document.getElementById("in-race");
  var outBackup = document.getElementById("out-backup");
  var inBackup = document.getElementById("in-backup");

  function openSheet(){
    inStart.value = state.start;
    inRace.value = state.race;
    refreshBackup();
    sheet.hidden = false;
  }
  function closeSheet(){ sheet.hidden = true; }
  document.getElementById("gear").addEventListener("click", openSheet);
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function(e){ if(e.target === sheet) closeSheet(); });

  inStart.addEventListener("change", function(){
    if(/^\d{4}-\d{2}-\d{2}$/.test(inStart.value)){
      state.start = inStart.value; state.updated = Date.now();
      openWeeks = {}; saveLS(); pushRemote(); render();
    }
  });
  inRace.addEventListener("change", function(){
    if(/^\d{4}-\d{2}-\d{2}$/.test(inRace.value)){
      state.race = inRace.value; state.updated = Date.now();
      saveLS(); pushRemote(); render();
    }
  });

  function refreshBackup(){ outBackup.value = JSON.stringify(state); }
  document.getElementById("copy-backup").addEventListener("click", function(){
    outBackup.select();
    try{ navigator.clipboard.writeText(outBackup.value); }catch(e){ try{ document.execCommand("copy"); }catch(_){} }
    this.textContent = "已复制";
    var b=this; setTimeout(function(){ b.textContent = "复制"; }, 1500);
  });
  document.getElementById("do-import").addEventListener("click", function(){
    try{
      var o = normalize(JSON.parse(inBackup.value));
      o.updated = Date.now();
      state = o; openWeeks = {};
      saveLS(); pushRemote(); render();
      inBackup.value = "";
      this.textContent = "导入成功";
      var b=this; setTimeout(function(){ b.textContent = "导入"; }, 1500);
    }catch(e){
      this.textContent = "格式不对";
      var b2=this; setTimeout(function(){ b2.textContent = "导入"; }, 1500);
    }
  });
  document.getElementById("do-reset").addEventListener("click", function(){
    if(!window.confirm("清空所有打卡记录？训练计划本身不受影响。")) return;
    state.done = {}; state.updated = Date.now();
    openWeeks = {}; saveLS(); pushRemote(); render();
  });

  // ---------- 云端同步（claude.ai db）----------
  function setSync(mode){
    syncMode = mode;
    var map = { cloud:"进度已同步到云端（换设备也能看）", local:"进度暂存在这台设备（记得偶尔导出备份）", saving:"保存中…" };
    els.syncNote.textContent = map[mode] || "";
  }
  function pushRemote(){
    if(docRef){ docRef.set(state).catch(function(){}); }
  }
  setSync("local");
  (function initDB(){
    if(!(window.claude && typeof window.claude.use === "function")) return;
    window.claude.use("db").then(function(db){
      if(!db) return;
      docRef = db.doc("progress/v1");
      docRef.onSnapshot(function(snap){
        var remote = snap.exists ? normalize(snap.data()) : null;
        if(remote && (remote.updated || 0) >= (state.updated || 0)){
          state = remote; saveLS(); render();
        } else if((state.updated || 0) > (remote ? (remote.updated||0) : 0)){
          docRef.set(state).catch(function(){});
        }
        setSync("cloud");
      }, function(){ setSync("local"); });
    }).catch(function(){});
  })();

  render();
})();
</script>
