<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>半马训练打卡（预览版）</title>
<meta name="description" content="5 个月 / 20 周 / 63 次训练，按顺序打卡，忙了顺延，完成总量即达标。">
<meta name="theme-color" content="#cf5f2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="半马打卡">

<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon-512.png">
<style>
/* 半马训练打卡 —— 样式。纯本地，不引任何外部字体 / CDN（国行手机也能秒开）。 */

:root {
  --clay: #cf5f2b;
  --clay-dark: #b34e20;
  --clay-soft: #f2d9cb;
  --bg: #f5f6f8;
  --card: #ffffff;
  --ink: #21242a;
  --ink-soft: #5b606b;
  --ink-faint: #9aa0ac;
  --line: #e6e8ec;
  --ok: #2f9e5e;
  --radius: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --clay: #e57a44;
    --clay-dark: #cf5f2b;
    --clay-soft: #4a2f22;
    --bg: #14161a;
    --card: #1e2127;
    --ink: #eceef2;
    --ink-soft: #b3b8c2;
    --ink-faint: #7c828e;
    --line: #2c3038;
    --ok: #4cc07e;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

body {
  padding:
    calc(var(--safe-top) + 12px)
    16px
    calc(var(--safe-bottom) + 28px);
  max-width: 560px;
  margin: 0 auto;
}

h1, h2, h3 { margin: 0; font-weight: 700; }
button { font-family: inherit; }
a { color: var(--clay); }

/* ── 顶部 ─────────────────────────────── */
.top { margin-bottom: 14px; }
.top h1 { font-size: 19px; letter-spacing: 0.5px; }
.top .sub { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }

.bar {
  margin-top: 10px;
  height: 10px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--clay), var(--clay-dark));
  border-radius: 999px;
  transition: width 0.4s ease;
}
.bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: 5px;
}
.bar-label b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ── 备份提醒条 ───────────────────────── */
.nudge {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff3e6;
  border: 1px solid #f0c9a0;
  color: #8a4b1d;
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 14px;
  font-size: 13px;
}
@media (prefers-color-scheme: dark) {
  .nudge { background: #3a2b1c; border-color: #5a4126; color: #e8b98a; }
}
.nudge span { flex: 1; }
.nudge-btn {
  flex: none;
  border: none;
  background: var(--clay);
  color: #fff;
  font-weight: 700;
  font-size: 12.5px;
  padding: 7px 12px;
  border-radius: 999px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* ── 卡片 ─────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag {
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--clay-soft);
  color: var(--clay-dark);
  font-weight: 600;
}
.tag.plain { background: var(--line); color: var(--ink-soft); }
.tag.rest  { background: #dceee2; color: #1f7a45; }
@media (prefers-color-scheme: dark) {
  .tag.rest { background: #1f3a2b; color: #7bd6a1; }
}

.next-head { font-size: 13px; color: var(--ink-faint); margin-bottom: 4px; }
.next-detail {
  font-size: 21px;
  font-weight: 700;
  line-height: 1.45;
  margin: 2px 0 12px;
}
.wc {
  display: flex;
  gap: 8px;
  font-size: 13.5px;
  color: var(--ink-soft);
  padding: 8px 0;
  border-top: 1px dashed var(--line);
}
.wc:last-of-type { border-bottom: 1px dashed var(--line); margin-bottom: 12px; }
.wc span:first-child { color: var(--ink-faint); flex: none; }

.focus {
  font-size: 13.5px;
  color: var(--ink-soft);
  background: var(--bg);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 14px;
}
.focus b { color: var(--ink); }

.check-row { display: flex; gap: 10px; align-items: center; }
input[type="date"] {
  flex: none;
  font-family: inherit;
  font-size: 15px;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
}
.btn {
  flex: 1;
  border: none;
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  background: var(--clay);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { background: var(--clay-dark); }
.btn.block { width: 100%; flex: none; }
.btn.ghost {
  background: transparent;
  color: var(--clay);
  border: 1px solid var(--clay-soft);
  width: 100%;
  flex: none;
  margin-bottom: 10px;
}
.btn.ghost:active { background: var(--clay-soft); }

/* ── 计时器 ───────────────────────────── */
.timer { text-align: center; }
.t-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12.5px;
  color: var(--ink-faint);
  text-align: left;
}
.t-x {
  flex: none;
  border: none;
  background: none;
  color: var(--ink-faint);
  font-size: 16px;
  padding: 4px 6px;
  cursor: pointer;
}
.t-plan {
  text-align: left;
  font-size: 13.5px;
  color: var(--ink-soft);
  margin: 6px 0 8px;
}
.t-note {
  text-align: left;
  font-size: 11.5px;
  color: var(--ink-faint);
  background: var(--bg);
  border-radius: 8px;
  padding: 7px 9px;
  margin: 0 0 10px;
}
.t-phase {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink-faint);
  letter-spacing: 2px;
}
.t-phase.run { color: var(--clay); }
.t-phase.walk { color: #2f7bb5; }
@media (prefers-color-scheme: dark) { .t-phase.walk { color: #6bb3e0; } }
.t-clock {
  font-size: 68px;
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
  margin: 2px 0;
}
.t-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.timer .bar { margin: 4px 0 12px; }
.t-done { font-size: 16px; font-weight: 700; color: var(--ok); margin: 6px 0 12px; }
.t-metro {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 12px;
}
.t-metro input[type="range"] { flex: 1; min-width: 120px; max-width: 200px; accent-color: var(--clay); }
.t-metro b { font-variant-numeric: tabular-nums; color: var(--ink); }
.t-ctrls { display: flex; gap: 10px; }
/* .btn.ghost 默认是 width:100% + flex:none，放进这个 flex 行会各占满一行、把「结束」挤出卡片。
   在计时器控制行里强制等分。 */
.t-ctrls .btn,
.t-ctrls .btn.ghost { margin: 0; flex: 1 1 0; width: auto; min-width: 0; }

.undo {
  display: inline-block;
  margin-top: 10px;
  font-size: 13px;
  color: var(--ink-faint);
  background: none;
  border: none;
  padding: 4px 0;
  cursor: pointer;
}

.done-banner { text-align: center; padding: 8px 0 2px; }
.done-banner .big { font-size: 40px; }
.done-banner .txt { font-size: 16px; font-weight: 700; margin-top: 4px; }

/* ── 统计 ─────────────────────────────── */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.stat { background: var(--card); padding: 13px 14px; }
.stat .n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--ink-faint); margin-top: 1px; }

/* ── 最近完成 ─────────────────────────── */
.rc {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 7px 0;
  border-top: 1px solid var(--line);
  font-size: 13px;
}
.rc:first-of-type { border-top: none; }
.rc-date { flex: none; width: 42px; color: var(--clay-dark); font-weight: 700; font-variant-numeric: tabular-nums; }
.rc-txt { flex: none; color: var(--ink-faint); }
.rc-detail { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 全部计划 ─────────────────────────── */
details.plan { margin-bottom: 14px; }
details.plan > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 15px;
}
details.plan[open] > summary { border-radius: var(--radius) var(--radius) 0 0; }
details.plan > summary::-webkit-details-marker { display: none; }
details.plan > summary::after { content: " ▾"; color: var(--ink-faint); }
details.plan[open] > summary::after { content: " ▴"; }

.weeks {
  border: 1px solid var(--line);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  overflow: hidden;
}
.wk { border-top: 1px solid var(--line); }
.wk:first-child { border-top: none; }
.wk h3 {
  font-size: 13px;
  padding: 10px 14px 4px;
  color: var(--ink-soft);
  background: var(--card);
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.wk h3 .r { font-size: 11px; color: #1f7a45; font-weight: 600; }
.wk-note {
  padding: 0 14px 8px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-faint);
  background: var(--card);
}
.sess {
  display: flex;
  gap: 10px;
  padding: 8px 14px;
  font-size: 13.5px;
  background: var(--card);
  align-items: flex-start;
}
.sess .mark { flex: none; width: 18px; text-align: center; color: var(--ink-faint); }
.sess.done .mark { color: var(--ok); }
.sess.now { background: var(--clay-soft); }
.sess.now .mark { color: var(--clay-dark); }
.sess .d { flex: none; color: var(--ink-faint); width: 62px; }
.sess .t { flex: 1; }
.sess.done .t { color: var(--ink-faint); text-decoration: line-through; }
.sess .at { flex: none; color: var(--ok); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ── 备份 ─────────────────────────────── */
details.tools > summary {
  cursor: pointer;
  list-style: none;
  font-size: 13px;
  color: var(--ink-faint);
  padding: 8px 0;
  text-align: center;
}
details.tools > summary::-webkit-details-marker { display: none; }
.tools-body { padding: 4px 0 0; }
.tools-body p { font-size: 12.5px; color: var(--ink-faint); margin: 6px 0; }
textarea {
  width: 100%;
  min-height: 90px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  background: var(--bg);
  color: var(--ink);
  resize: vertical;
}
.mini-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.mini {
  flex: 1;
  min-width: 96px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  border-radius: 10px;
  padding: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.mini.danger { color: var(--clay); border-color: var(--clay-soft); }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--safe-bottom) + 20px);
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  font-size: 13px;
  padding: 9px 16px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 0.94; }

.foot { text-align: center; font-size: 11.5px; color: var(--ink-faint); margin-top: 18px; }

</style>
</head>
<body>

<header class="top">
  <h1>半马训练打卡</h1>
  <div class="sub">5 个月 · 20 周 · 63 次训练　|　按顺序完成，忙了顺延，做完总量就达标</div>
  <div class="bar"><i id="barFill" style="width:0%"></i></div>
  <div class="bar-label"><span>已完成 <b id="barDone">0 / 63 次</b></span><span><b id="barPct">0%</b></span></div>
</header>

<div class="nudge" id="backupNudge" hidden>
  <span id="backupNudgeText"></span>
  <button class="nudge-btn" id="backupNudgeBtn">立即备份</button>
</div>

<section class="card" id="nextCard"></section>

<section class="card timer" id="timerCard" hidden></section>

<section class="stats" id="stats"></section>

<section class="card" id="recentCard" hidden></section>

<details class="plan">
  <summary>全部计划（20 周）</summary>
  <div class="weeks" id="weeks"></div>
</details>

<details class="tools" id="toolsBox">
  <summary>⚙ 备份 / 恢复 / 清空</summary>
  <div class="tools-body">
    <p>打卡记录只存在这台手机里，iOS 偶尔会清掉。「保存备份」会打开分享面板，存进备忘录 / 文件，或发给自己。<b>要存文字，别只截图</b>——截图恢复不了。</p>
    <p id="backupStatus" class="muted"></p>
    <textarea id="backupBox" placeholder="恢复时把备份文本粘进这里，再点「导入备份」。"></textarea>
    <div class="mini-row">
      <button class="mini" id="saveBtn">保存备份</button>
      <button class="mini" id="importBtn">导入备份</button>
      <button class="mini danger" id="resetBtn">清空</button>
    </div>
  </div>
</details>

<div class="foot">数据全部保存在本机 · 无账号 · 无网络也能打卡</div>
<div class="toast" id="toast"></div>

<script type="module">

/* ===== src/plan.js ===== */
const __plan = (() => {
// 训练计划数据 —— 5 个月 / 20 周 / 共 63 次训练。
//
// 打卡规则（用户定的）：不按日历强制，按顺序完成；忙了就顺延，
// 只要把 63 次训练做完就算达标。所以程序里「进度」= 已完成次数 / 63，
// 「接下来」= 第一个还没打卡的训练。
//
// 每次训练都包含三段：跑前动态伸展 → 主课 → 跑后静态拉伸。
// runMin 是「主课里轻松跑 / 节奏跑 / 心率跑的大致分钟数」，只用来做「累计跑量」这个统计，
// 纯冲刺测试（200 米 / 1600 米）和按公里数、比赛日计的课次记为 null，不进这个统计。
const WARMUP = '跑前动态伸展';
const COOLDOWN = '跑后静态拉伸';

// 每个元素是一周。数组顺序 = 周次（第 1 周 … 第 20 周）。
const WEEKS = [
  // ── 第一个月：走跑结合（run-walk） ───────────────────────────
  {
    month: 1, weekOfMonth: 1, phase: '走跑结合', recovery: false,
    focus: '关注跑姿是不是「重力跑」，以及心率有没有保持在轻松跑区间。跑起来心率会缓慢升高，2—3 分钟才到轻松跑强度；不要因为心率上升慢就跑太快，跑到没力气就不是轻松跑了。',
    sessions: [
      { day: '周二', detail: '（轻松跑 4 分钟 + 正常走 1 分钟）× 4', runMin: 16 },
      { day: '周四', detail: '（轻松跑 5 分钟 + 正常走 1 分钟）× 4', runMin: 20 },
      { day: '周六', detail: '（轻松跑 5 分钟 + 正常走 1 分钟）× 5', runMin: 25 },
    ],
  },
  {
    month: 1, weekOfMonth: 2, phase: '走跑结合', recovery: false,
    focus: '单次跑步时间在慢慢加长，仍然关注姿势和心率。',
    sessions: [
      { day: '周二', detail: '（轻松跑 7 分钟 + 正常走 1 分钟）× 3', runMin: 21 },
      { day: '周四', detail: '（轻松跑 8 分钟 + 正常走 1 分钟）× 3', runMin: 24 },
      { day: '周六', detail: '（轻松跑 9 分钟 + 正常走 1 分钟）× 3', runMin: 27 },
    ],
  },
  {
    month: 1, weekOfMonth: 3, phase: '走跑结合', recovery: false,
    focus: '本周是第一个月训练量最高的一周。只要关注点在姿势和心率上，还是能轻松完成。下周是恢复周。',
    sessions: [
      { day: '周二', detail: '（轻松跑 11 分钟 + 正常走 1 分钟）× 2', runMin: 22 },
      { day: '周四', detail: '（轻松跑 13 分钟 + 正常走 1 分钟）× 2', runMin: 26 },
      { day: '周六', detail: '（轻松跑 15 分钟 + 正常走 1 分钟）× 2', runMin: 30 },
    ],
  },
  {
    month: 1, weekOfMonth: 4, phase: '走跑结合', recovery: true,
    focus: '减量、恢复周。前三周完成得很好，这周降低运动量让身体恢复。运动量和上周接近，如果跑起来感觉更轻松，说明身体在进步。',
    sessions: [
      { day: '周二', detail: '（轻松跑 11 分钟 + 正常走 1 分钟）× 2', runMin: 22 },
      { day: '周四', detail: '（轻松跑 12 分钟 + 正常走 1 分钟）× 2', runMin: 24 },
      { day: '周六', detail: '（轻松跑 10 分钟 + 正常走 1 分钟）× 3', runMin: 30 },
    ],
  },

  // ── 第二个月：连续轻松跑 ─────────────────────────────────────
  {
    month: 2, weekOfMonth: 1, phase: '连续轻松跑', recovery: false,
    focus: '本周目标是长时间连续跑，中间不再有走的时间。',
    sessions: [
      { day: '周二', detail: '轻松跑 30 分钟', runMin: 30 },
      { day: '周四', detail: '轻松跑 20 分钟', runMin: 20 },
      { day: '周六', detail: '轻松跑 30 分钟', runMin: 30 },
    ],
  },
  {
    month: 2, weekOfMonth: 2, phase: '连续轻松跑', recovery: false,
    focus: '在姿势和心率的基础上，本周开始关注步频，提高到 170 步/分钟以上，最好 180 左右。重点是「拉起」这个动作的速度，拉起越快，脚落地越轻。',
    sessions: [
      { day: '周二', detail: '轻松跑 30 分钟', runMin: 30 },
      { day: '周四', detail: '轻松跑 30 分钟', runMin: 30 },
      { day: '周六', detail: '轻松跑 40 分钟', runMin: 40 },
    ],
  },
  {
    month: 2, weekOfMonth: 3, phase: '连续轻松跑', recovery: false,
    focus: '本月连续跑时间最长的一周，现在已经可以跑很久、很远了。',

/**
 * 把「按周」的数据摊平成「按次」的有序数组，并补上 seq / warmup / cooldown 等字段。
 * @param {typeof WEEKS} weeks
 * @returns {Array<object>} 每次训练一个对象，seq 从 1 递增
 */
function buildPlan(weeks = WEEKS) {
  const plan = [];
  let seq = 0;
  weeks.forEach((w, weekIndex) => {
    w.sessions.forEach((s) => {
      seq += 1;
      plan.push({
        seq,
        week: weekIndex + 1,
        month: w.month,
        weekOfMonth: w.weekOfMonth,
        phase: w.phase,
        recovery: w.recovery,
        day: s.day,
        warmup: WARMUP,
        cooldown: COOLDOWN,
        detail: s.detail,
        focus: w.focus,
        runMin: s.runMin ?? null,
        race: s.race === true,
      });
    });
  });
  return plan;
}
const PLAN = buildPlan();
const TOTAL_SESSIONS = PLAN.length;
const TOTAL_WEEKS = WEEKS.length;

return { WARMUP, COOLDOWN, buildPlan, PLAN, TOTAL_SESSIONS, TOTAL_WEEKS };
})();

/* ===== src/progress.js ===== */
const __progress = (() => {
// 进度计算 —— 全是纯函数，不碰 DOM、不碰存储，方便测试。
//
// state 的形状：{ checkins: [{ seq, at }, ...] }
//   - checkins 按「完成的先后顺序」排列
//   - checkins.length 就是「指针」：已经完成了多少次
//   - at 是打卡日期，'YYYY-MM-DD' 字符串
//
// 顺延模型：下一课永远是「计划里的第 (已完成数 + 1) 项」，
// 跟具体哪天、跳过几天、打卡记录里存的是哪个 seq 都无关。

const MS_PER_DAY = 86400000;
function doneCount(state) {
  return state.checkins.length;
}
function nextSession(plan, state) {
  const i = state.checkins.length;
  return i < plan.length ? plan[i] : null;
}
function isComplete(plan, state) {
  return state.checkins.length >= plan.length;
}
function progressPercent(plan, state) {
  if (plan.length === 0) return 0;
  return Math.round((state.checkins.length / plan.length) * 100);
}
function currentWeek(plan, state) {
  const next = nextSession(plan, state);
  if (next) return next.week;
  return plan.length ? plan[plan.length - 1].week : 0;
}

// 当前周（= 下一课所在的周）完成了几次、共几次。
function weekProgress(plan, state) {
  const week = currentWeek(plan, state);
  const inWeek = plan.filter((s) => s.week === week);
  if (inWeek.length === 0) return { week, done: 0, total: 0 };
  const firstSeq = inWeek[0].seq;
  const done = Math.max(0, Math.min(inWeek.length, state.checkins.length - (firstSeq - 1)));
  return { week, done, total: inWeek.length };
}

// 给计划里每一次训练加上状态：done（是否完成）、at（完成日期，未完成为 null）、isNext（是不是下一课）。
// 顺延模型下 checkins[i] 恰好对应 plan[i]，直接按下标配。
function annotatePlan(plan, state) {
  const done = state.checkins.length;
  return plan.map((s, i) => ({
    ...s,
    done: i < done,
    at: i < done ? state.checkins[i].at : null,
    isNext: i === done,
  }));
}

// 最近完成的 n 次，最新在前。每项带上计划里的信息 + 完成日期。
function recentCheckins(plan, state, n = 5) {
  const done = state.checkins.length;
  const out = [];
  for (let i = done - 1; i >= 0 && out.length < n; i--) {
    const s = plan[i] || {};
    out.push({ seq: s.seq ?? state.checkins[i].seq, week: s.week ?? null, detail: s.detail ?? '', at: state.checkins[i].at });
  }
  return out;
}

// 按「最近的实际打卡节奏」外推完成日期。数据不足或已完成时返回 null。
function estimateFinishDate(plan, state, today) {
  const done = state.checkins.length;
  const left = plan.length - done;
  if (left <= 0) return null;
  if (done < 2) return null;

  const first = new Date(state.checkins[0].at);
  const last = new Date(state.checkins[done - 1].at);
  const spanDays = Math.max(1, (last - first) / MS_PER_DAY);
  const perDay = (done - 1) / spanDays;
  if (perDay <= 0) return null;

  const daysLeft = Math.ceil(left / perDay);
  const finish = new Date(today);
  finish.setDate(finish.getDate() + daysLeft);
  return finish.toISOString().slice(0, 10);
}

return { doneCount, nextSession, isComplete, progressPercent, currentWeek, weekProgress, annotatePlan, recentCheckins, estimateFinishDate };
})();

/* ===== src/stats.js ===== */
const __stats = (() => {
// 统计数字 —— 纯函数，喂给顶部那排小字。
// state 形状同 progress.js：{ checkins: [{ seq, at }] }，at 是 'YYYY-MM-DD'。

const MS_PER_DAY = 86400000;

function shift(dateStr, deltaDays) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + deltaDays);
  return d.toISOString().slice(0, 10);
}

// 整个计划的总跑量（分钟），null 记 0。
function totalRunMinutes(plan) {
  return plan.reduce((sum, s) => sum + (s.runMin || 0), 0);
}

// 已打卡课次的累计跑量（分钟）。按 seq 去计划里查。
function completedRunMinutes(plan, state) {
  const bySeq = new Map(plan.map((s) => [s.seq, s]));
  return state.checkins.reduce((sum, c) => {
    const s = bySeq.get(c.seq);
    return sum + (s && s.runMin ? s.runMin : 0);
  }, 0);
}

// 最近 N 天（含今天）里的打卡次数。
function checkinsInLastDays(state, today, days) {
  const cutoff = shift(today, -(days - 1));
  return state.checkins.filter((c) => c.at >= cutoff && c.at <= today).length;
}

// 有训练的不同日期数（同一天做两次只算一天）。
function distinctActiveDays(state) {
  return new Set(state.checkins.map((c) => c.at)).size;
}

// 从第一次打卡到今天的天数（含头尾）。没打过卡返回 0。
function daysSinceStart(state, today) {
  if (state.checkins.length === 0) return 0;
  const first = new Date(state.checkins[0].at);
  return Math.floor((new Date(today) - first) / MS_PER_DAY) + 1;
}

// 平均每周打卡次数，保留 1 位小数。
function avgPerWeek(state, today) {
  const days = daysSinceStart(state, today);
  if (days <= 0) return 0;
  return Number((state.checkins.length / (days / 7)).toFixed(1));
}

return { totalRunMinutes, completedRunMinutes, checkinsInLastDays, distinctActiveDays, daysSinceStart, avgPerWeek };
})();

/* ===== src/store.js ===== */
const __store = (() => {
// 打卡记录的存取。所有「会变的状态」都收在这里，
// 通过一个注入的 storage（浏览器里是 localStorage，测试里是内存替身）落盘。
//
// 主数据很小：{ checkins: [{ seq, at }] }
//   seq —— 计划里的第几次训练（1 起）
//   at  —— 打卡日期 'YYYY-MM-DD'
//
// 另存一份「上次备份」的书签（设备本地，不进导出内容）：
//   { at: 'YYYY-MM-DD' | null, count: number }
const STORAGE_KEY = 'marathon-checkin-v1';
const BACKUP_KEY = 'marathon-checkin-backup-v1';
const EXPORT_VERSION = 1;

const emptyState = () => ({ checkins: [] });
const emptyBackup = () => ({ at: null, count: 0 });

function isValidCheckin(c) {
  return c && Number.isInteger(c.seq) && typeof c.at === 'string' && c.at.length > 0;
}

// 从任意形状的备份对象里取出 checkins（兼容旧的裸 {checkins:[...]} 和新的带版本号的）。
function extractCheckins(parsed) {
  if (!parsed || !Array.isArray(parsed.checkins)) return null;
  return parsed.checkins.filter(isValidCheckin);
}
function createStore(storage) {
  let state = readState();
  let backup = readBackup();

  function readState() {
    try {
      const raw = storage.getItem(STORAGE_KEY);
      if (!raw) return emptyState();
      const list = extractCheckins(JSON.parse(raw));
      return list ? { checkins: list } : emptyState();
    } catch {
      return emptyState();
    }
  }

  function readBackup() {
    try {
      const raw = storage.getItem(BACKUP_KEY);
      if (!raw) return emptyBackup();
      const b = JSON.parse(raw);
      return {
        at: typeof b.at === 'string' ? b.at : null,
        count: Number.isInteger(b.count) ? b.count : 0,
      };
    } catch {
      return emptyBackup();
    }
  }

  function persist() {
    try { storage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch { /* 写满 / 隐私模式：内存里还在 */ }
  }
  function persistBackup() {
    try { storage.setItem(BACKUP_KEY, JSON.stringify(backup)); } catch { /* 同上 */ }
  }

  function snapshot() {
    return {
      checkins: state.checkins.map((c) => ({ ...c })),
      backup: { ...backup },
    };
  }

  return {
    get: snapshot,

    checkIn(seq, at) {
      state.checkins.push({ seq, at });
      persist();
      return snapshot();
    },

    undoLast() {
      state.checkins.pop();
      persist();
      return snapshot();
    },

    setDate(index, at) {
      if (state.checkins[index]) {
        state.checkins[index].at = at;
        persist();
      }
      return snapshot();
    },

    reset() {
      state = emptyState();
      persist();
      return snapshot();
    },

    // 导出内容带上版本号和时间；不含设备本地的备份书签。
    exportJson() {
      return JSON.stringify(
        { app: 'marathon-checkin', version: EXPORT_VERSION, exportedAt: new Date().toISOString(), checkins: state.checkins },
        null,
        2,
      );
    },

    importJson(text) {
      const parsed = JSON.parse(text); // 非 JSON 会在这里抛
      const list = extractCheckins(parsed);
      if (!list) throw new Error('备份格式不对：缺少 checkins 列表');
      state = { checkins: list };
      persist();
      return snapshot();
    },

    // 用户确实把备份保存出去了（分享 / 复制 / 导出成功）后调一次，记下书签。
    markBackedUp(at) {
      backup = { at, count: state.checkins.length };
      persistBackup();
      return snapshot();
    },
  };
}

return { STORAGE_KEY, BACKUP_KEY, EXPORT_VERSION, createStore };
})();

  if (!s) return '';
  const [, m, d] = s.split('-');
  return `${+m}/${+d}`;
}

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

function render() {
  const state = store.get();
  const done = doneCount(state);
  const pct = progressPercent(PLAN, state);
  const complete = isComplete(PLAN, state);

  // 顶部进度条
  $('barFill').style.width = pct + '%';
  $('barDone').textContent = `${done} / ${TOTAL_SESSIONS} 次`;
  $('barPct').textContent = pct + '%';

  // 「接下来」卡片
  const card = $('nextCard');
  if (complete) {
    card.innerHTML = `
      <div class="done-banner">
        <div class="big">🎉</div>
        <div class="txt">63 次训练全部完成，去比赛吧！</div>
      </div>`;
  } else {
    const s = nextSession(PLAN, state);
    const wp = weekProgress(PLAN, state);
    card.innerHTML = `
      <div class="tag-row">
        <span class="tag">第 ${s.month} 月 · ${s.phase}</span>
        <span class="tag plain">第 ${s.week} / ${TOTAL_WEEKS} 周（本周 ${wp.done}/${wp.total}）</span>
        ${s.recovery ? '<span class="tag rest">减量 / 恢复</span>' : ''}
      </div>
      <div class="next-head">接下来 · 第 ${s.seq} 次（计划里标注为 ${esc(s.day)}）</div>
      <div class="next-detail">${esc(s.detail)}</div>
      <div class="wc"><span>热身</span><span>${esc(s.warmup)}</span></div>
      <div class="wc"><span>放松</span><span>${esc(s.cooldown)}</span></div>
      <div class="focus"><b>教练的话：</b>${esc(s.focus)}</div>
      <button class="btn ghost" id="startTimerBtn">▶ 开始计时</button>
      <div class="check-row">
        <input type="date" id="ciDate" value="${todayStr()}" max="${todayStr()}" aria-label="打卡日期">
        <button class="btn" id="ciBtn">完成打卡</button>
      </div>
      ${done > 0 ? '<button class="undo" id="undoBtn">↩ 撤销上一次打卡</button>' : ''}
    `;
    $('startTimerBtn').onclick = () => openTimer(s);
    $('ciBtn').onclick = () => {
      $('ciBtn').disabled = true; // 防手抖连点两下多打一次
      const at = $('ciDate').value || todayStr();
      store.checkIn(nextSession(PLAN, store.get()).seq, at);
      render();
      toast('已打卡 ✓');
    };
    if ($('undoBtn')) $('undoBtn').onclick = () => {
      store.undoLast();
      render();
      toast('已撤销');
    };
  }

  // 统计
  const ranDone = completedRunMinutes(PLAN, state);
  const ranTotal = totalRunMinutes(PLAN);
  const finish = estimateFinishDate(PLAN, state, todayStr());
  const small = 'font-size:13px;color:var(--ink-faint)';
  $('stats').innerHTML = `
    <div class="stat"><div class="n">${done}<span style="${small}"> / ${TOTAL_SESSIONS}</span></div><div class="k">已完成训练</div></div>
    <div class="stat"><div class="n">${TOTAL_SESSIONS - done}</div><div class="k">还剩几次</div></div>
    <div class="stat"><div class="n">${checkinsInLastDays(state, todayStr(), 7)}</div><div class="k">近 7 天打卡</div></div>
    <div class="stat"><div class="n">${avgPerWeek(state, todayStr()) || 0}</div><div class="k">平均每周次数</div></div>
    <div class="stat"><div class="n">${Math.round(ranDone / 60)}<span style="${small}"> / ${Math.round(ranTotal / 60)} 小时</span></div><div class="k">累计跑量（估算）</div></div>
    <div class="stat"><div class="n" style="font-size:14px;font-weight:600">${finish ? fmtDate(finish) : '再打几次卡'}</div><div class="k">按当前节奏预计完成</div></div>
  `;

  renderRecent(state);
  renderBackup(state);
  renderWeeks(state);
}

function renderBackup(state) {
  const b = state.backup || { at: null, count: 0 };
  $('backupStatus').textContent = b.at
    ? `上次备份：${fmtDate(b.at)}（当时 ${b.count} 次）`
    : '还没备份过';

  const due = backupDue(state, todayStr());
  const nudge = $('backupNudge');
  if (due.due) {
    $('backupNudgeText').textContent = `有 ${due.pending} 次打卡还没备份，存一份免得丢`;
    nudge.hidden = false;
  } else {
    nudge.hidden = true;
  }
}

// 打开分享面板保存备份；不支持分享就退回复制 / 选中。成功后记下备份书签。
async function saveBackup() {
  const text = store.exportJson();
  $('backupBox').value = text;
  try {
    if (navigator.share) {
      await navigator.share({ title: '半马打卡备份', text });
      toast('已发起保存');
      store.markBackedUp(todayStr());
      render();
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // 用户取消，不算备份
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制备份文本，粘到备忘录里存好');
  } catch {
    $('backupBox').select();
    toast('已选中备份文本，请长按复制保存');
  }
  store.markBackedUp(todayStr());
  render();
}

function renderRecent(state) {
  const list = recentCheckins(PLAN, state, 5);
  const card = $('recentCard');
  if (list.length === 0) {
    card.hidden = true;
    return;
  }
  card.hidden = false;
  card.innerHTML = `<div class="next-head">最近完成</div>` + list.map((r) => `
    <div class="rc">
      <span class="rc-date">${fmtShort(r.at)}</span>
      <span class="rc-txt">第 ${r.seq} 次 · 第 ${r.week} 周</span>
      <span class="rc-detail">${esc(r.detail)}</span>
    </div>`).join('');
}

function renderWeeks(state) {
  const ann = annotatePlan(PLAN, state);
  let html = '';
  for (let wk = 1; wk <= TOTAL_WEEKS; wk++) {
    const inWeek = ann.filter((s) => s.week === wk);
    const head = inWeek[0];
    html += `<div class="wk"><h3>第 ${wk} 周 · 第 ${head.month} 月 ${esc(head.phase)}${head.recovery ? ' <span class="r">减量</span>' : ''}</h3>`;
    html += `<div class="wk-note">${esc(head.focus)}</div>`;
    for (const s of inWeek) {
      html += `<div class="sess ${s.done ? 'done' : ''} ${s.isNext ? 'now' : ''}">
        <span class="mark">${s.done ? '✓' : s.isNext ? '→' : '·'}</span>
        <span class="d">${esc(s.day)}</span>
        <span class="t">${esc(s.detail)}</span>
        <span class="at">${s.at ? fmtShort(s.at) : ''}</span>
      </div>`;
    }
    html += '</div>';
  }
  $('weeks').innerHTML = html;
}

// ── 跑步计时器 ────────────────────────────
// 纯逻辑（解析、时间轴、时钟格式）在 src/segments.js + src/timer.js，有测试。
// 这里是薄壳：墙上时间驱动的循环、提示音、屏幕常亮、DOM。
const beeper = createBeeper();
let T = null; // 当前计时会话；null = 没在计时

function openTimer(session) {
  const parsed = parseSession(session.detail);
  T = {
    session,
    parsed,
    segments: parsed.segments || [],
    startMs: 0,
    pausedAccumMs: 0,
    pauseStartMs: 0,
    running: false,
    lastIndex: -1,
    lastTick: -1,
    raf: 0,
    gen: 0, // 每次 (重新)启动循环 +1；旧的一代自己退出，避免后台回来后循环叠加
    wakeLock: null,
    bpm: 180,
    metro: false,
  };
  $('timerCard').hidden = false;
  renderTimer();
  $('timerCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeTimer() {
  stopClock();
  releaseWake();
  beeper.setMetronome(null);
  T = null;
  $('timerCard').hidden = true;
}

function elapsedSec() {
  return elapsedFrom(T, Date.now());
}

async function startClock() {
  beeper.unlock(); // 必须在用户手势里
  T.startMs = Date.now();
  T.pausedAccumMs = 0;
  T.pauseStartMs = 0;
  T.running = true;
  T.lastIndex = -1;
  T.lastTick = -1;
  await requestWake();
  if (T.metro) beeper.setMetronome(T.bpm);
  startLoop();
  renderTimer();
}

function pauseClock() {
  if (!T || !T.running) return;
  T.running = false;
  T.gen += 1; // 让当前循环这一代作废
  T.pauseStartMs = Date.now();
  cancelAnimationFrame(T.raf);
  releaseWake();
  beeper.setMetronome(null);
  renderTimer();
}

function resumeClock() {
  if (!T || T.running || !T.startMs) return;
  T.pausedAccumMs += Date.now() - T.pauseStartMs;
  T.pauseStartMs = 0;
  T.running = true;
  requestWake();
  if (T.metro) beeper.setMetronome(T.bpm);
  startLoop();
  renderTimer();
}

function stopClock() {
  if (T) {
    T.running = false;
    T.gen += 1;
    cancelAnimationFrame(T.raf);
  }
}

// 启动新一代帧循环；上一代（如果还在）下一帧会自己发现代号变了而退出。
function startLoop() {
  const gen = ++T.gen;
  const frame = () => {
    if (!T || !T.running || gen !== T.gen) return;
    tickFrame();
    if (T && T.running && gen === T.gen) T.raf = requestAnimationFrame(frame);
  };
  frame();
}

function tickFrame() {
  if (!T || !T.running) return;
  const e = elapsedSec();

  if (T.parsed.type === 'freeform') {
    paintFreeform(e);
    return;
  }

  const st = stateAt(T.segments, e);
  paintTimed(st);

  const fc = frameCues({ index: T.lastIndex, tick: T.lastTick }, st);
  for (const c of fc.cues) (c === 'tick' ? beeper.tick() : beeper.cue(c));
  T.lastIndex = fc.index;
  T.lastTick = fc.tick;

  if (st.done) {
    T.running = false;
    T.gen += 1;
    releaseWake();
    beeper.setMetronome(null);
    renderTimer(true);
  }
}

async function requestWake() {
  try {
    if ('wakeLock' in navigator) T.wakeLock = await navigator.wakeLock.request('screen');
  } catch { /* 电量低 / 不支持：算了 */ }
}
function releaseWake() {
  try { if (T && T.wakeLock) T.wakeLock.release(); } catch { /* ignore */ }
  if (T) T.wakeLock = null;
}

// 页面从后台回到前台：Wake Lock 会被系统释放，重新申请；循环也重新踢一下。
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && T && T.running) {
    requestWake();
    if (T.metro) beeper.setMetronome(T.bpm); // 后台会挂起音频，重新起节拍器
    startLoop(); // 新一代循环；后台冻结的旧帧回来发现代号变了会自己退出
  }
});

function timerHeadHtml(finished) {
  const s = T.session;
  return `
    <div class="t-head">
      <span>第 ${s.seq} 次 · 第 ${s.week} 周 · ${esc(s.phase)}</span>
      <button class="t-x" id="tCloseBtn" aria-label="关闭计时器">✕</button>
    </div>
    <div class="t-plan">${esc(s.detail)}</div>
    ${finished ? '' : `<p class="t-note">iPhone 网页不支持震动，用提示音提醒。已尝试让屏幕保持常亮；锁屏放兜里时提示音可能延后。</p>`}
  `;
}

function metroRowHtml() {
  return `
    <label class="t-metro">
      <input type="checkbox" id="tMetroChk" ${T.metro ? 'checked' : ''}>
      节拍音
      <input type="range" id="tMetroBpm" min="165" max="190" step="5" value="${T.bpm}" ${T.metro ? '' : 'disabled'}>
      <b id="tBpmLbl">${T.bpm}</b> 步/分
    </label>`;
}

function renderTimer(finished) {
  if (!T) return;
  const started = !!T.startMs;
  const card = $('timerCard');

  if (T.parsed.type === 'freeform') {
    card.innerHTML = timerHeadHtml(false) + `
      <div class="t-phase">秒表</div>
      <div class="t-clock" id="tClock">0:00</div>
      <div class="t-sub">这次含按距离 / 自定义组间休息的部分，不自动循环，照上面计划来，这里当秒表用。</div>
      ${metroRowHtml()}
      <div class="t-ctrls">
        ${!started || !T.running
          ? `<button class="btn" id="tStartBtn">${started ? '继续' : '开始'}</button>`
          : `<button class="btn ghost" id="tPauseBtn">暂停</button>`}
        <button class="btn ghost" id="tStopBtn">结束</button>
      </div>`;
    if (started) paintFreeform(elapsedSec());
    wireTimerCtrls(finished);
    return;
  }

  card.innerHTML = timerHeadHtml(finished) + `
    <div class="t-phase" id="tPhase">${started ? '' : '预备'}</div>
    <div class="t-clock" id="tClock">${started ? '' : formatClock(T.segments[0].sec)}</div>
    <div class="t-sub" id="tSub"></div>
    <div class="bar"><i id="tBar" style="width:0%"></i></div>
    ${finished ? `
      <div class="t-done">✅ 这次训练完成！</div>
      <div class="t-ctrls">
        <button class="btn" id="tCheckinBtn">顺手打卡</button>
        <button class="btn ghost" id="tStopBtn">关闭</button>
      </div>`
    : `
      ${metroRowHtml()}
      <div class="t-ctrls">
        ${!T.running
          ? `<button class="btn" id="tStartBtn">${started ? '继续' : '开始'}</button>`
          : `<button class="btn ghost" id="tPauseBtn">暂停</button>`}
        <button class="btn ghost" id="tStopBtn">结束</button>
      </div>`}
  `;
  if (started && !finished) paintTimed(stateAt(T.segments, elapsedSec()));
  wireTimerCtrls(finished);
}

function paintTimed(st) {
  const phase = $('tPhase');
  if (!phase) return;
  if (st.done) {
    phase.textContent = '完成';
    $('tClock').textContent = '0:00';
    return;
  }
  phase.textContent = st.kind === 'walk' ? '走' : '跑';
  phase.className = 't-phase ' + (st.kind === 'walk' ? 'walk' : 'run');
  $('tClock').textContent = formatClock(st.segRemaining);
  const sub = $('tSub');
  if (T.parsed.type === 'runwalk') {
    const pair = Math.floor(st.index / 2) + 1;
    sub.textContent = `第 ${pair} / ${T.parsed.reps} 组 · 总剩 ${formatClock(st.totalRemaining)}`;
  } else {
    sub.textContent = `总剩 ${formatClock(st.totalRemaining)}`;
  }
  $('tBar').style.width = (st.total ? (st.totalElapsed / st.total) * 100 : 0) + '%';
}

function paintFreeform(e) {
  const c = $('tClock');
  if (c) c.textContent = formatClock(Math.floor(e));
}

function wireTimerCtrls(finished) {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('tCloseBtn', closeTimer);
  on('tStopBtn', closeTimer);
  on('tStartBtn', () => (T.startMs ? resumeClock() : startClock()));
  on('tPauseBtn', pauseClock);
  on('tCheckinBtn', () => {
    const at = todayStr();
    store.checkIn(nextSession(PLAN, store.get()).seq, at);
    closeTimer();
    render();
    toast('已打卡 ✓');
  });
  const chk = $('tMetroChk');
  if (chk) chk.onchange = () => {
    T.metro = chk.checked;
    $('tMetroBpm').disabled = !T.metro;
    beeper.setMetronome(T.metro && T.running ? T.bpm : null);
  };
  const bpm = $('tMetroBpm');
  if (bpm) bpm.oninput = () => {
    T.bpm = Number(bpm.value);
    $('tBpmLbl').textContent = T.bpm;
    if (T.metro && T.running) beeper.setMetronome(T.bpm);
  };
  void finished;
}

// ── 备份工具 ──────────────────────────────
function wireTools() {
  $('saveBtn').onclick = saveBackup;
  $('backupNudgeBtn').onclick = () => {
    $('toolsBox').open = true;
    saveBackup();
  };
  $('importBtn').onclick = () => {
    const text = $('backupBox').value.trim();
    if (!text) return toast('先把备份文本粘进上面的框');
    try {
      store.importJson(text);
      render();
      toast('已导入备份');
    } catch (e) {
      toast('导入失败：' + e.message);
    }
  };
  $('resetBtn').onclick = () => {
    if (confirm('确定清空所有打卡记录？建议先「保存备份」。')) {
      store.reset();
      render();
      toast('已清空');
    }
  };
}

// ── 启动 ──────────────────────────────
render();
wireTools();


</script>
